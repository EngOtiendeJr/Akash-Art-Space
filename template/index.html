{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="{% block theme_color %}#A94336{% endblock %}">
    <meta name="description" content="{% block meta_description %}Visit The Akash Art Space in Nairobi. Find visitor information, exhibitions, and contact details.{% endblock %}">
    <title>{% block title %}The Akash Art Space | Nairobi{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="{% static 'img/logo.jpg' %}">
    <link rel="apple-touch-icon" href="{% static 'img/logo.jpg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=gallery-all-orientations-20261025">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "header.html" %}

    {% block content %}{% endblock %}

    {% include "footer.html" %}

    <script src="{% static 'js/script.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
